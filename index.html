<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salary + OT + Expense Calculator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #cbd5e1;
            --danger-color: #dc2626;
            --danger-bg: #fef2f2;
            --success-color: #16a34a;
            --success-bg: #f0fdf4;
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 16px;
            box-shadow: var(--shadow-md);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 18px;
            color: var(--primary-color);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            background: var(--primary-light);
            padding: 8px 12px;
            border-radius: 10px;
            margin: 16px 0 12px 0;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 360px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-card label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .input-card input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;
            outline: none;
        }

        .input-card input:focus {
            border-color: var(--primary-color);
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .expense-item {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #f8fafc;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .expense-item input[type="text"] {
            flex: 1.2;
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .expense-item input[type="number"] {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-del {
            background: var(--danger-bg);
            color: var(--danger-color);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-add-exp {
            width: 100%;
            padding: 12px;
            background: var(--primary-light);
            color: var(--primary-color);
            border: 1.5px dashed var(--primary-color);
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .summary-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-top: 14px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .summary-item .value {
            font-weight: 600;
            color: var(--text-main);
        }

        .summary-item.bold {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            margin-top: 4px;
        }

        .summary-item.bold .value {
            color: var(--primary-color);
        }

        .ot-breakdown {
            font-size: 0.72rem;
            color: var(--text-sub);
            text-align: right;
            padding-bottom: 4px;
        }

        .result-box {
            margin-top: 16px;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            background: #e2e8f0;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .result-positive {
            background: var(--success-bg);
            color: var(--success-color);
            border: 1px solid #bbf7d0;
        }

        .result-negative {
            background: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Salary & OT Calculator</h1>

    <!-- Section 1 -->
    <div class="section-title">1. เงินเดือน & รายรับอื่นๆ</div>
    <div class="input-grid">
        <div class="input-card">
            <label>เงินเดือน (บาท)</label>
            <input type="number" id="salary" inputmode="decimal" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>ทำงาน (ชม./วัน)</label>
            <input type="number" id="hours" inputmode="decimal" placeholder="8" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>จำนวนวันเดินทาง</label>
            <input type="number" id="work_days" inputmode="decimal" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>เบี้ยเลี้ยง (บาท/วัน)</label>
            <input type="number" id="travel" inputmode="decimal" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>ค่ากะกลางคืน (บาท/วัน)</label>
            <input type="number" id="night_shift" inputmode="decimal" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>ค่าภาษา (บาท)</label>
            <input type="number" id="lang_allowance" inputmode="decimal" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>OT x1.0 (ชม.)</label>
            <input type="number" id="ot1" inputmode="decimal" value="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>OT x1.5 (ชม.)</label>
            <input type="number" id="ot15" inputmode="decimal" value="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>OT x2.0 (ชม.)</label>
            <input type="number" id="ot2" inputmode="decimal" value="0" oninput="calculate()">
        </div>
        <div class="input-card">
            <label>OT x3.0 (ชม.)</label>
            <input type="number" id="ot3" inputmode="decimal" value="0" oninput="calculate()">
        </div>
    </div>

    <!-- Section 2 -->
    <div class="section-title">2. รายการค่าใช้จ่าย</div>
    <div class="expense-list" id="expense-container"></div>
    <button class="btn-add-exp" onclick="addExpenseRow()">+ เพิ่มรายการค่าใช้จ่าย</button>

    <!-- Section 3 -->
    <div class="section-title">3. สรุปผลคำนวณ</div>
    <div class="summary-card">
        <div class="summary-item">
            <span>เงินเดือนฐาน</span>
            <span class="value" id="lbl_salary">-</span>
        </div>
        <div class="summary-item">
            <span>ค่าภาษา</span>
            <span class="value" id="lbl_lang">-</span>
        </div>
        <div class="summary-item">
            <span>รวมค่า OT</span>
            <span class="value" id="lbl_ot">-</span>
        </div>
        <div class="ot-breakdown" id="lbl_ot_detail">-</div>
        <div class="summary-item">
            <span>เบี้ยเลี้ยงเดินทาง</span>
            <span class="value" id="lbl_travel">-</span>
        </div>
        <div class="summary-item">
            <span>ค่ากะกลางคืน</span>
            <span class="value" id="lbl_night">-</span>
        </div>
        <div class="summary-item bold">
            <span>รวมรายรับทั้งหมด</span>
            <span class="value" id="lbl_total_income">-</span>
        </div>
        <div class="summary-item">
            <span>หัก ประกันสังคม (5%)</span>
            <span class="value" id="lbl_ss" style="color:var(--danger-color);">-</span>
        </div>
        <div class="summary-item bold">
            <span>รายรับหลังหักประกันสังคม</span>
            <span class="value" id="lbl_after_ss">-</span>
        </div>
        <div class="summary-item">
            <span>รวมค่าใช้จ่าย</span>
            <span class="value" id="lbl_expense" style="color:var(--danger-color);">-</span>
        </div>
    </div>

    <div class="result-box" id="lbl_remaining">กรอกข้อมูลเพื่อคำนวณ</div>
</div>

<script>
    function addExpenseRow() {
        const container = document.getElementById('expense-container');
        const rowId = 'exp_' + Date.now();
        const rowDiv = document.createElement('div');
        rowDiv.className = 'expense-item';
        rowDiv.id = rowId;

        rowDiv.innerHTML = `
            <input type="text" placeholder="ชื่อรายการ" oninput="calculate()">
            <input type="number" inputmode="decimal" placeholder="จำนวนเงิน" oninput="calculate()">
            <button class="btn-del" onclick="document.getElementById('${rowId}').remove(); calculate();">ลบ</button>
        `;

        container.appendChild(rowDiv);
        calculate();
    }

    function getNum(id) {
        const el = document.getElementById(id);
        if (!el) return 0;
        const val = parseFloat(el.value);
        return isNaN(val) ? 0 : val;
    }

    function formatNum(num) {
        return num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculate() {
        const salary = getNum('salary');
        const hoursPerDay = getNum('hours');

        if (salary <= 0 || hoursPerDay <= 0) {
            clearSummary();
            return;
        }

        const workDays = getNum('work_days');
        const travelPerDay = getNum('travel');
        const nightPerDay = getNum('night_shift');
        const langAllowance = getNum('lang_allowance');

        const ot1 = getNum('ot1');
        const ot15 = getNum('ot15');
        const ot2 = getNum('ot2');
        const ot3 = getNum('ot3');

        const hourlyRate = salary / 30 / hoursPerDay;

        const moneyOt1 = hourlyRate * ot1 * 1.0;
        const moneyOt15 = hourlyRate * ot15 * 1.5;
        const moneyOt2 = hourlyRate * ot2 * 2.0;
        const moneyOt3 = hourlyRate * ot3 * 3.0;
        const totalOt = moneyOt1 + moneyOt15 + moneyOt2 + moneyOt3;

        const totalTravel = workDays * travelPerDay;
        const totalNight = workDays * nightPerDay;
        const socialSecurity = Math.min(salary * 0.05, 875.0);

        const totalIncome = salary + totalOt + totalTravel + totalNight + langAllowance;
        const incomeAfterSs = totalIncome - socialSecurity;

        let totalExpense = 0;
        const rows = document.querySelectorAll('#expense-container .expense-item');
        rows.forEach(row => {
            const inputs = row.querySelectorAll('input');
            const amt = parseFloat(inputs[1].value);
            if (!isNaN(amt) && amt > 0) {
                totalExpense += amt;
            }
        });

        const remainingMoney = incomeAfterSs - totalExpense;

        document.getElementById('lbl_salary').innerText = formatNum(salary);
        document.getElementById('lbl_lang').innerText = formatNum(langAllowance);
        document.getElementById('lbl_ot').innerText = formatNum(totalOt);
        document.getElementById('lbl_ot_detail').innerText = 
            `x1: ${formatNum(moneyOt1)} | x1.5: ${formatNum(moneyOt15)} | x2: ${formatNum(moneyOt2)} | x3: ${formatNum(moneyOt3)}`;
        document.getElementById('lbl_travel').innerText = formatNum(totalTravel);
        document.getElementById('lbl_night').innerText = formatNum(totalNight);
        document.getElementById('lbl_total_income').innerText = formatNum(totalIncome);
        document.getElementById('lbl_ss').innerText = '-' + formatNum(socialSecurity);
        document.getElementById('lbl_after_ss').innerText = formatNum(incomeAfterSs);
        document.getElementById('lbl_expense').innerText = '-' + formatNum(totalExpense);

        const remBox = document.getElementById('lbl_remaining');
        if (remainingMoney >= 0) {
            remBox.className = 'result-box result-positive';
            remBox.innerText = 'คงเหลือ: ' + formatNum(remainingMoney) + ' บาท';
        } else {
            remBox.className = 'result-box result-negative';
            remBox.innerText = 'ขาดดุล: ' + formatNum(remainingMoney) + ' บาท';
        }
    }

    function clearSummary() {
        ['lbl_salary','lbl_lang','lbl_ot','lbl_ot_detail','lbl_travel','lbl_night','lbl_total_income','lbl_ss','lbl_after_ss','lbl_expense'].forEach(id => {
            document.getElementById(id).innerText = '-';
        });
        const remBox = document.getElementById('lbl_remaining');
        remBox.className = 'result-box';
        remBox.innerText = 'กรอกข้อมูลเพื่อคำนวณ';
    }
</script>
</body>
</html>
